<app-section-title TitleName="Forgot password?" Description="Enter your email and we’ll help you get back into your account."></app-section-title>
@if (!submitted) {
  <form class="mt-4" (ngSubmit)="submit()">
    <div class="mb-3">
      <label for="recoveryEmail" class="form-label">Email address</label>
      <input type="email" id="recoveryEmail" name="email" [(ngModel)]="email" class="form-control" required email>
    </div>
    <app-button buttonName="asBtnPrimary" buttonType="submit" buttonText="Send reset instructions"></app-button>
  </form>
} @else {
  <div class="alert alert-success mt-4" role="status">If an account exists for {{ email }}, password reset instructions are ready in this demo.</div>
}
<div class="d-flex align-items-center pt-4">
  <p class="mb-0">Remembered your password?</p>
  <a class="ms-3 text-capitalize" routerLink="/auth/login">Sign in</a>
</div>
