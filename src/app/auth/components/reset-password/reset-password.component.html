<app-section-title TitleName="Set a new password" Description="Choose a secure password with at least eight characters."></app-section-title>
@if (!updated) {
  <form class="mt-4" (ngSubmit)="submit()">
    <div class="mb-3">
      <label for="newPassword" class="form-label">New password</label>
      <input type="password" id="newPassword" name="password" [(ngModel)]="password" class="form-control" required minlength="8">
    </div>
    <div class="mb-3">
      <label for="confirmNewPassword" class="form-label">Confirm password</label>
      <input type="password" id="confirmNewPassword" name="confirmPassword" [(ngModel)]="confirmPassword" class="form-control" required minlength="8">
    </div>
    @if (confirmPassword && password !== confirmPassword) { <small class="text-danger">Passwords do not match.</small> }
    @if (confirmPassword && password.length < 8) { <small class="text-danger">Use at least eight characters.</small> }
    <app-button buttonName="asBtnPrimary" buttonType="submit" buttonText="Update password"></app-button>
  </form>
} @else {
  <div class="alert alert-success mt-4" role="status">Your password was updated for this demo. Please sign in again.</div>
}
<div class="d-flex align-items-center pt-4">
  <a class="text-capitalize" routerLink="/auth/login">Back to sign in</a>
</div>
