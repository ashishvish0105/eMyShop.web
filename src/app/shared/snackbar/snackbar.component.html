<div class="snackbar" [class]="'snackbar snackbar--' + data.type" [style.background-color]="data.backgroundColor" role="status">
    <i [class]="data.icon + ' snackbar__icon'" aria-hidden="true"></i>
    <span class="snackbar__message">{{ data.message }}</span>
    <button class="snackbar__close" type="button" aria-label="Close notification" (click)="close()">
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>
</div>
