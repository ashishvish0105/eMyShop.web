<aside class="admin-sidebar">
  <a class="sidebar-brand" routerLink="/seller-Account/dashboard">
    <span class="brand-icon material-symbols-outlined">restaurant</span>
    <span><strong>RestoAdmin</strong><small>Central dashboard</small></span>
  </a>
  <nav aria-label="Restaurant administration">
    @for (item of navItems; track item.routerLink) {
      <a class="nav-item" [routerLink]="item.routerLink" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="material-symbols-outlined">{{ item.icon }}</span><span>{{ item.name }}</span>
      </a>
    }
  </nav>
  <div class="sidebar-bottom">
    <a class="nav-item settings-item" routerLink="/seller-Account/settings" routerLinkActive="active">
      <span class="material-symbols-outlined">settings</span><span>Settings</span>
    </a>
    <button class="logout-button" type="button" (click)="userLogOute()"><span class="material-symbols-outlined">logout</span>Logout</button>
  </div>
</aside>
