<div class="side-bar" [class]="{'eMy-sideBarCollapsed': !isSideNavBarOpen}">
    <!-- SideNavBar -->
    <div class="eMy-sidebarWithButton">
        <div class="dashboard-subTitle">
            <h1 class="font-headline-md text-headline text-primary">AdminConsole</h1>
            <p class="font-label-sm text-label text-secondary">Management Suite</p>
        </div>

        <button class="eMy-menuIcon" (click)="toggleSideNavBar()">
            <span class="material-symbols-outlined" [attr.data-icon]="isSideNavBarOpen?'menu':'close'">{{isSideNavBarOpen?'menu':'close'  }}</span>
        </button>

    </div>


    <nav class="eMy-sideNav-bar">
        <ul class="eMy-nave-list">
            @for (item of navItems; track $index) {
            <li class="eMy-nave-item" [class.active]="activeItemName === item.routerLink" (click)="activeMenuItem(item.routerLink)">
                <span class="material-symbols-outlined" [attr.data-icon]="item.icon">{{ item.icon }}</span>
                <span class="emy-nave-item-lable">{{ item.name }}</span>
            </li>
            }
        </ul>
