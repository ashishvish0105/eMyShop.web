<div class="modal-backdrop" (click)="closed.emit()">
    <section class="order-detail-dialog" role="dialog" aria-modal="true" aria-labelledby="order-detail-title" (click)="$event.stopPropagation()">
        <div class="order-detail-heading">
            <div>
                <p class="eyebrow">ORDER DETAILS</p>
                <h2 id="order-detail-title">{{ order.id }}</h2>
            </div>
            <button type="button" aria-label="Close order details" (click)="closed.emit()">×</button>
        </div>
        <div class="order-detail-content">
            <div><span>Order status</span><strong>{{ order.deliveryStatus }}</strong></div>
            <div><span>Payment</span><strong>{{ order.paymentStatus }}</strong></div>
            <div><span>Items</span><strong>{{ order.items }}</strong></div>
            <div><span>Delivery address</span><strong>{{ deliveryAddress }}</strong></div>
            <div><span>Order total</span><strong>{{ order.total | currency }}</strong></div>
        </div>
        <div class="order-detail-actions">
            <button class="keep-order" type="button" (click)="closed.emit()">Close</button>
            @if (canCancel) {
            <button class="confirm-cancel" type="button" (click)="cancelOrder.emit(order.id)">Cancel order</button>
            }
        </div>
    </section>
</div>
