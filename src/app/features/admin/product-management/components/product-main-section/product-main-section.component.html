<div class="eMy-dashboard-containt">
    <div class="eMy-section-title-withbuttons-containt">
        <app-section-title-withbuttons sectionTitle="Products" description="Manage your inventory and product listings across all channels.">
            <app-emy-buttons [button]="buttons[0]" (click)="addProductNavbar()"></app-emy-buttons>
        </app-section-title-withbuttons>
    </div>

    <div class="eMy-summary-card-container">
        <div class="eMy-summary-card-left">
            @if (productsError()) {
            <div class="alert alert-warning" role="alert">{{ productsError() }}</div>
            }
            <app-table-with-title tableClass="product-table" [tableColumnNamas]="tableColumnNamas" [tableData]="products()" [serverSidePagination]="true" [showRowActions]="true" [totalCount]="products().length ? products()[0].totalCount ?? products().length : 0" (pageSizeChange)="onPageSizeChange($event)" (viewRow)="viewProduct($event)" (editRow)="editProduct($event)" (deleteRow)="deleteProduct($event)"></app-table-with-title>
        </div>
        <div class="eMy-summary-card-right">
            <app-title-with-item titleName="Top Categories">
                <div slot="item" class="eMy-proressBarGroup">
                    @for (category of categorySummary(); track category.name) {
                    <app-progress-bar [progressPercentage]="category.percentage" progressBgColor="#004ac6" [progressTitle]="category.name"></app-progress-bar>
                    }
                    @if (!categorySummary().length) {
                    <p class="text-muted mb-0">No category data available yet.</p>
                    }
                </div>
                <div slot="item" class="eMy-unlockInventoryDetailed eMy-mt-6">
                    <h4 class="eMy-lable">Unlock Detailed Inventory Insights & Forecasts</h4>
                </div>
            </app-title-with-item>
        </div>
    </div>
    <div class="eMy-table-with-title-container">
    </div>
</div>
