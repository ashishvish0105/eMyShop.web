<form class="row" [formGroup]="UserForm" (submit)="UserFormData(UserForm.value)">
    <div class="control-group col-md-6">
        <label for="firname" class="text-capitalize">firstName</label>
        <input class="form-control" type="text" formControlName="firstName">
    </div>
    <div class="control-group col-md-6">
        <label for="firname" class="text-capitalize">LastName</label>
        <input class="form-control" type="text" formControlName="lastName">
    </div>
    <div class="control-group col-md-6">
        <label for="firname" class="text-capitalize">email</label>
        <input class="form-control" type="text" formControlName="email">
    </div>
    <div class="control-group col-md-6">
        <label for="firname" class="text-capitalize">mobile Number</label>
        <input class="form-control" type="text" formControlName="mobileNumber">
    </div>
    <div class="control-group col-md-6">
        <label for="firname" class="text-capitalize">address</label>
        <input class="form-control" type="text" formControlName="address">
    </div>
    <div class="control-group col-md-6">
        <label for="firname" class="text-capitalize">city</label>
        <input class="form-control" type="text" formControlName="city">
    </div>
    <div class="control-group col-md-6">
        <label for="firname" class="text-capitalize">state</label>
        <input class="form-control" type="text" formControlName="state">
    </div>
    <div class="control-group col-md-6">
        <label for="firname" class="text-capitalize">country</label>
        <input class="form-control" type="text" formControlName="country">
    </div>
    <div class="control-group col-md-6">
        <label for="firname" class="text-capitalize">postal Code</label>
        <input class="form-control" type="text" formControlName="postalCode">
    </div>
    <div class="control-group col-md-6">
        <label for="firname" class="text-capitalize">role</label>
        <input class="form-control" type="text" formControlName="role">
    </div>
    <div class="control-group col-md-6">
        <label for="firname" class="text-capitalize">years Of Experience</label>
        <input class="form-control" type="number" formControlName="yearsOfExperience">
    </div>
    <div class="control-group col-md-6">
        <label for="firname" class="text-capitalize">skills	</label>
        <input class="form-control" type="text" formControlName="skills">
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="submit" class="btn btn-primary">Save changes</button>
    </div>
</form>
