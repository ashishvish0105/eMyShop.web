
<header class="nearshop-header sticky-top">
  <div class="container-fluid nearshop-container">
    <div class="d-flex align-items-center justify-content-between gap-3">

      <!-- Logo -->
      <a href="#top" class="nearshop-brand d-flex align-items-center gap-2 text-decoration-none">
        <div class="nearshop-logo d-flex align-items-center justify-content-center">
          <svg width="20" height="20" viewBox="0 0 24 24"
               fill="none" aria-hidden="true">
            <path d="M4 9.5L6.5 4.5H17.5L20 9.5"
                  stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"></path>

            <path d="M4 9.5C4 11.1569 5.34315 12.5 7 12.5C8.65685 12.5 10 11.1569 10 9.5C10 11.1569 11.3431 12.5 13 12.5C14.6569 12.5 16 11.1569 16 9.5C16 11.1569 17.3431 12.5 19 12.5C19.5523 12.5 20 12.0523 20 11.5V9.5"
                  stroke="currentColor" stroke-width="2"
                  stroke-linecap="round"></path>

            <path d="M6 12.5V19.5H18V12.5"
                  stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"></path>

            <circle cx="17" cy="17" r="2.5" fill="#10B981"></circle>
          </svg>
        </div>

        <span class="nearshop-brand-name">NearShop</span>
      </a>

      <!-- Desktop Navigation -->
      <nav class="nearshop-nav d-none d-lg-flex align-items-center gap-4"
           aria-label="Primary navigation">

        <a href="#how-it-works">How It Works</a>
        <a href="#benefits">Benefits</a>
        <a href="#dashboard">Dashboard</a>
        <a href="#trust">Local Impact</a>

      </nav>

      <!-- Header Actions -->
      <div class="d-flex align-items-center gap-2">

        <button type="button"
                class="btn nearshop-register-btn d-none d-sm-inline-flex"
                data-open-register>
          Register Your Shop
        </button>

        <!-- Mobile Toggle -->
        <button class="btn nearshop-mobile-toggle d-lg-none"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#nearshopMobileMenu"
                aria-controls="nearshopMobileMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">

          <svg width="24" height="24" viewBox="0 0 24 24"
               fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round">
            <path d="M4 6H20"></path>
            <path d="M4 12H20"></path>
            <path d="M4 18H20"></path>
          </svg>

        </button>

      </div>
    </div>

    <!-- Mobile Navigation -->
    <div class="collapse nearshop-mobile-menu" id="nearshopMobileMenu">

      <nav class="d-flex flex-column gap-3"
           aria-label="Mobile navigation">

        <a href="#how-it-works">How It Works</a>
        <a href="#benefits">Benefits</a>
        <a href="#dashboard">Dashboard</a>
        <a href="#trust">Local Impact</a>

        <button type="button"
                class="btn nearshop-register-btn d-sm-none"
                data-open-register>
          Register Your Shop
        </button>

      </nav>

    </div>

  </div>
</header>
