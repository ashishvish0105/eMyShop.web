
<section class="cta-section">
  <div class="container">

    <div class="cta-wrapper">

      <!-- Decorative Background -->
      <div class="cta-decoration" aria-hidden="true"></div>

      <!-- CTA Content -->
      <div class="cta-content">

        <h2 class="cta-title">
          Ready to Take Your Shop Online?
        </h2>

        <p class="cta-description">
          Join our growing local business community and give your shop
          the digital presence it deserves.
        </p>

        <div class="cta-action">

          <button
            type="button"
            class="btn cta-button"
            (click)="openRegistration()"
          >
            <i class="fa-solid fa-store"></i>
            <span>Create Your Shop Today</span>
          </button>

          <p class="cta-note">
            Start your digital journey with us.
          </p>

        </div>

      </div>

    </div>

  </div>
</section>
