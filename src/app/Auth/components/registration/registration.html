<!-- Overlay for readability -->
<div class="absolute inset-0 bg-background-light/90 dark:bg-background-dark/95"></div>
<div class="relative z-10 w-full max-w-[540px] bg-white dark:bg-gray-900 shadow-2xl rounded-xl overflow-hidden border border-gray-100 dark:border-gray-800">
    <div class="p-8 md:p-10">
        <!-- Headline & Body Text -->
        <div class="mb-8">
            <h1 class="text-[#0d1b10] dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center pb-2">Create your account</h1>
            <p class="text-gray-600 dark:text-gray-400 text-base font-normal leading-normal text-center">Start ordering your favorite meals in seconds.</p>
        </div>
        <form class="space-y-4">
            <!-- Full Name -->
            <div class="flex flex-col gap-1.5">
                <label class="text-[#0d1b10] dark:text-gray-200 text-sm font-medium">Full Name</label>
                <div class="relative group">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary">person</span>
                    <input class="form-input flex w-full rounded-lg text-[#0d1b10] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-12 pl-12 pr-4 placeholder:text-gray-400 text-sm font-normal"
                        placeholder="John Doe" type="text" />
                </div>
            </div>
            <!-- Email -->
            <div class="flex flex-col gap-1.5">
                <label class="text-[#0d1b10] dark:text-gray-200 text-sm font-medium">Email Address</label>
                <div class="relative group">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary">mail</span>
                    <input class="form-input flex w-full rounded-lg text-[#0d1b10] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-12 pl-12 pr-4 placeholder:text-gray-400 text-sm font-normal"
                        placeholder="name@example.com" type="email" />
                </div>
            </div>
            <!-- Phone Number -->
            <div class="flex flex-col gap-1.5">
                <label class="text-[#0d1b10] dark:text-gray-200 text-sm font-medium">Phone Number</label>
                <div class="relative group">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary">call</span>
                    <input class="form-input flex w-full rounded-lg text-[#0d1b10] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-12 pl-12 pr-4 placeholder:text-gray-400 text-sm font-normal"
                        placeholder="+1 (555) 000-0000" type="tel" />
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Password -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[#0d1b10] dark:text-gray-200 text-sm font-medium">Password</label>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary">lock</span>
                        <input class="form-input flex w-full rounded-lg text-[#0d1b10] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-12 pl-12 pr-4 placeholder:text-gray-400 text-sm font-normal"
                            placeholder="••••••••" type="password" />
                    </div>
                </div>
                <!-- Confirm Password -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[#0d1b10] dark:text-gray-200 text-sm font-medium">Confirm</label>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary">lock</span>
                        <input class="form-input flex w-full rounded-lg text-[#0d1b10] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-12 pl-12 pr-4 placeholder:text-gray-400 text-sm font-normal"
                            placeholder="••••••••" type="password" />
                    </div>
                </div>
            </div>
            <!-- Terms Checkbox -->
            <div class="flex items-start gap-3 py-2">
                <input class="mt-1 h-5 w-5 rounded border-gray-300 text-primary focus:ring-primary" id="terms" type="checkbox" />
                <label class="text-sm text-gray-600 dark:text-gray-400 leading-tight" for="terms">
                            I agree to the <a class="text-primary font-medium hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-medium hover:underline" href="#">Privacy Policy</a>.
                        </label>
            </div>
            <!-- Submit Button -->
            <button class="w-full flex items-center justify-center rounded-lg h-14 bg-primary text-[#0d1b10] text-base font-bold leading-normal tracking-[0.015em] hover:opacity-90 transition-all shadow-lg shadow-primary/20 mt-4" type="submit">
                        Create Account
                    </button>
        </form>
        <!-- Footer Link -->
        <div class="mt-8 text-center">
            <p class="text-sm text-gray-600 dark:text-gray-400">
                Already have an account?
                <a class="text-primary font-bold hover:underline ml-1" href="#">Log in</a>
            </p>
        </div>
    </div>
    <!-- Bottom decorative bar -->
    <div class="h-1.5 w-full bg-primary"></div>
</div>
