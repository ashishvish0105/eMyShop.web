<div class="w-screen w-full max-w-[480px] bg-white dark:bg-[#152a18] rounded-xl shadow-xl overflow-hidden border border-[#e7f3e9] dark:border-[#1f3d23]">
    <!-- Contextual Illustration Section -->
    <div class="bg-primary/5 dark:bg-primary/10 py-8 flex flex-col items-center justify-center border-b border-[#e7f3e9] dark:border-[#1f3d23]">
        <div class="size-20 bg-primary rounded-full flex items-center justify-center text-white mb-4 shadow-lg shadow-primary/20">
            <span class="material-symbols-outlined text-[40px]">shield_person</span>
        </div>
        <div class="flex items-center gap-2 text-primary font-semibold">
            <span class="material-symbols-outlined text-sm">lock</span>
            <span class="text-sm uppercase tracking-widest">Secure Verification</span>
        </div>
    </div>
    <!-- Header and Body Text -->
    <div class="pt-8 pb-4">
        <h1 class="text-[#0d1b10] dark:text-white tracking-tight text-[28px] md:text-[32px] font-bold leading-tight px-6 text-center pb-2">Enter Verification Code</h1>
        <p class="text-gray-600 dark:text-gray-400 text-base font-normal leading-normal px-8 text-center">
            We've sent a 6-digit code to <span class="font-semibold text-[#0d1b10] dark:text-white">+1 (555) 000-0000</span>. Please enter it below to confirm your identity.
        </p>
    </div>
    <!-- OTP Input Section -->
    <div class="flex justify-center px-6 py-6">
        <fieldset class="relative flex gap-3 md:gap-4">
            <input class="flex h-14 w-12 md:w-14 text-center [appearance:textfield] focus:outline-0 focus:ring-2 focus:ring-primary/50 rounded-lg border border-[#cfe7d3] dark:border-[#1f3d23] dark:bg-[#0d1b10] dark:text-white text-xl font-bold leading-normal transition-all"
                max="9" maxlength="1" min="0" placeholder="•" type="number" value="" />
            <input class="flex h-14 w-12 md:w-14 text-center [appearance:textfield] focus:outline-0 focus:ring-2 focus:ring-primary/50 rounded-lg border border-[#cfe7d3] dark:border-[#1f3d23] dark:bg-[#0d1b10] dark:text-white text-xl font-bold leading-normal transition-all"
                max="9" maxlength="1" min="0" placeholder="•" type="number" value="" />
            <input class="flex h-14 w-12 md:w-14 text-center [appearance:textfield] focus:outline-0 focus:ring-2 focus:ring-primary/50 rounded-lg border border-[#cfe7d3] dark:border-[#1f3d23] dark:bg-[#0d1b10] dark:text-white text-xl font-bold leading-normal transition-all"
                max="9" maxlength="1" min="0" placeholder="•" type="number" value="" />
            <input class="flex h-14 w-12 md:w-14 text-center [appearance:textfield] focus:outline-0 focus:ring-2 focus:ring-primary/50 rounded-lg border border-[#cfe7d3] dark:border-[#1f3d23] dark:bg-[#0d1b10] dark:text-white text-xl font-bold leading-normal transition-all"
                max="9" maxlength="1" min="0" placeholder="•" type="number" value="" />
            <input class="flex h-14 w-12 md:w-14 text-center [appearance:textfield] focus:outline-0 focus:ring-2 focus:ring-primary/50 rounded-lg border border-[#cfe7d3] dark:border-[#1f3d23] dark:bg-[#0d1b10] dark:text-white text-xl font-bold leading-normal transition-all"
                max="9" maxlength="1" min="0" placeholder="•" type="number" value="" />
            <input class="flex h-14 w-12 md:w-14 text-center [appearance:textfield] focus:outline-0 focus:ring-2 focus:ring-primary/50 rounded-lg border border-[#cfe7d3] dark:border-[#1f3d23] dark:bg-[#0d1b10] dark:text-white text-xl font-bold leading-normal transition-all"
                max="9" maxlength="1" min="0" placeholder="•" type="number" value="" />
        </fieldset>
    </div>
    <!-- Timer Section -->
    <div class="px-8 pb-4">
        <div class="flex items-center justify-center gap-2 py-4">
            <p class="text-gray-500 dark:text-gray-400 text-sm font-medium">Resend code in</p>
            <div class="flex gap-1 items-center bg-[#e7f3e9] dark:bg-[#0d1b10] px-3 py-1 rounded-full border border-primary/20">
                <span class="text-primary text-sm font-bold leading-tight">01</span>
                <span class="text-primary text-sm font-bold leading-tight">:</span>
                <span class="text-primary text-sm font-bold leading-tight">59</span>
            </div>
        </div>
    </div>
    <!-- Submit Action -->
    <div class="px-8 pb-4">
        <button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-95 flex items-center justify-center gap-2">
                    Verify Code
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
    </div>
    <!-- Footer Links -->
    <div class="px-8 pb-10 flex flex-col items-center gap-3">
        <button class="text-primary text-sm font-semibold hover:underline opacity-50 cursor-not-allowed">
                    Didn't receive the code? Resend
                </button>
        <div class="h-[1px] w-full bg-[#e7f3e9] dark:bg-[#1f3d23] my-2"></div>
        <a class="text-gray-500 dark:text-gray-400 text-sm font-medium hover:text-[#0d1b10] dark:hover:text-white flex items-center gap-1" href="#">
            <span class="material-symbols-outlined text-sm">edit</span> Change phone number
        </a>
    </div>
</div>
