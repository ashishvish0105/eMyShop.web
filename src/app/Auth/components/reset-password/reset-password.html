<!-- <main class="flex-grow flex items-center justify-center p-6 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-primary/10 via-background-light to-background-light dark:from-primary/5 dark:via-background-dark dark:to-background-dark"> -->
<div class="w-screen w-full max-w-[520px] bg-white dark:bg-[#152a19] shadow-xl rounded-xl overflow-hidden border border-[#cfe7d3] dark:border-[#1f3d24]">
    <div class="p-8 md:p-12">
        <!-- Heading -->
        <div class="mb-8">
            <h1 class="text-[#0d1b10] dark:text-white text-3xl font-black leading-tight tracking-[-0.033em] mb-2">Set a new password</h1>
            <p class="text-[#4c9a59] dark:text-[#7ab685] text-base font-medium">Choose a strong password you haven't used before</p>
        </div>
        <!-- Form -->
        <form class="space-y-6">
            <!-- New Password Field -->
            <div class="flex flex-col gap-2">
                <label class="text-[#0d1b10] dark:text-gray-200 text-sm font-bold uppercase tracking-wider">New Password</label>
                <div class="flex w-full items-stretch rounded-lg shadow-sm">
                    <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d1b10] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#cfe7d3] dark:border-[#2d4d33] bg-[#f8fcf9] dark:bg-[#1a331d] h-14 placeholder:text-[#4c9a59]/60 p-[15px] rounded-r-none border-r-0 text-base font-normal"
                        placeholder="Enter your new password" type="password" />
                    <div class="text-[#4c9a59] dark:text-primary flex border border-[#cfe7d3] dark:border-[#2d4d33] bg-[#f8fcf9] dark:bg-[#1a331d] items-center justify-center pr-[15px] rounded-r-lg border-l-0 cursor-pointer">
                        <span class="material-symbols-outlined">visibility</span>
                    </div>
                </div>
            </div>
            <!-- Confirm Password Field -->
            <div class="flex flex-col gap-2">
                <label class="text-[#0d1b10] dark:text-gray-200 text-sm font-bold uppercase tracking-wider">Confirm New Password</label>
                <div class="flex w-full items-stretch rounded-lg shadow-sm">
                    <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d1b10] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#cfe7d3] dark:border-[#2d4d33] bg-[#f8fcf9] dark:bg-[#1a331d] h-14 placeholder:text-[#4c9a59]/60 p-[15px] rounded-r-none border-r-0 text-base font-normal"
                        placeholder="Re-enter your new password" type="password" />
                    <div class="text-[#4c9a59] dark:text-primary flex border border-[#cfe7d3] dark:border-[#2d4d33] bg-[#f8fcf9] dark:bg-[#1a331d] items-center justify-center pr-[15px] rounded-r-lg border-l-0 cursor-pointer">
                        <span class="material-symbols-outlined">visibility</span>
                    </div>
                </div>
            </div>
            <!-- Requirements Checklist -->
            <div class="bg-primary/5 dark:bg-primary/10 rounded-lg p-4 space-y-3">
                <p class="text-xs font-bold text-[#4c9a59] dark:text-primary uppercase tracking-widest mb-2">Security Requirements</p>
                <label class="flex items-center gap-x-3 cursor-default group">
<div class="flex h-5 w-5 items-center justify-center rounded border-[#cfe7d3] dark:border-[#2d4d33] border-2 bg-white dark:bg-background-dark text-primary">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
<p class="text-[#0d1b10] dark:text-gray-300 text-sm font-medium">At least 8 characters</p>
</label>
                <label class="flex items-center gap-x-3 cursor-default group">
<div class="flex h-5 w-5 items-center justify-center rounded border-[#cfe7d3] dark:border-[#2d4d33] border-2 bg-white dark:bg-background-dark text-primary/30">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
<p class="text-[#0d1b10] dark:text-gray-300 text-sm font-medium">One uppercase letter</p>
</label>
                <label class="flex items-center gap-x-3 cursor-default group">
<div class="flex h-5 w-5 items-center justify-center rounded border-[#cfe7d3] dark:border-[#2d4d33] border-2 bg-white dark:bg-background-dark text-primary/30">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
<p class="text-[#0d1b10] dark:text-gray-300 text-sm font-medium">One number or symbol</p>
</label>
            </div>
            <!-- Action Button -->
            <button class="w-full flex items-center justify-center overflow-hidden rounded-xl h-14 px-6 bg-primary text-[#0d1b10] text-lg font-black leading-normal tracking-[0.015em] shadow-lg shadow-primary/20 hover:scale-[1.01] active:scale-[0.99] transition-all"
                type="submit">
                        Reset Password
                    </button>
            <!-- Navigation Link -->
            <div class="text-center pt-2">
                <a class="text-[#4c9a59] dark:text-[#7ab685] text-sm font-semibold hover:text-primary transition-colors flex items-center justify-center gap-1 group" href="javscript:void(0)" routerLink="/login">
                    <span class="material-symbols-outlined text-base group-hover:-translate-x-1 transition-transform">arrow_back</span> Back to Login
                </a>
            </div>
        </form>
    </div>
    <!-- Branding Accent -->
    <div class="bg-[#f8fcf9] dark:bg-[#1a331d] py-4 px-8 border-t border-[#cfe7d3] dark:border-[#2d4d33] flex items-center justify-center gap-2">
        <span class="text-xs font-medium text-[#4c9a59] dark:text-gray-400">Secure encryption by</span>
        <span class="text-xs font-bold text-[#0d1b10] dark:text-white uppercase tracking-tighter italic">FoodieDash Security</span>
    </div>
</div>
