<div class="w-screen w-full max-w-[480px] bg-white dark:bg-background-dark border border-[#e7f3e9] dark:border-white/10 rounded-xl shadow-xl p-8 md:p-12">
    <div class="flex flex-col items-center">
        <div class="mb-6 p-4 rounded-full bg-primary/10 text-primary">
            <span class="material-symbols-outlined text-4xl">lock_reset</span>
        </div>
        <h1 class="text-[#0d1b10] dark:text-white tracking-light text-[32px] font-bold leading-tight text-center pb-3">
            Forgot Password?
        </h1>
        <p class="text-[#0d1b10]/70 dark:text-white/70 text-base font-normal leading-relaxed pb-8 text-center max-w-[340px]">
            No worries! It happens to the best of us. Enter your email below to get back to ordering your favorite meals.
        </p>
        <form class="w-full space-y-6">
            <div class="flex flex-col gap-2">
                <label class="flex flex-col w-full">
                <p class="text-[#0d1b10] dark:text-white text-sm font-medium leading-normal pb-2">Email Address</p>
                <div class="relative">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#4c9a59] dark:text-primary/50 text-xl">mail</span>
                <input class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-lg text-[#0d1b10] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#cfe7d3] dark:border-white/20 bg-[#f8fcf9] dark:bg-white/5 focus:border-primary h-14 placeholder:text-[#4c9a59]/60 dark:placeholder:text-white/30 pl-12 pr-4 text-base font-normal leading-normal transition-all" placeholder="email@example.com" required="" type="email"/>
                </div>
                </label>
            </div>
            <div class="pt-2">
                <button class="w-full flex cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-[#0d1b10] text-base font-bold leading-normal tracking-[0.015em] hover:brightness-105 active:scale-[0.98] transition-all" type="submit">
                <span class="truncate">Send Reset Link</span>
                </button>
            </div>
        </form>
        <div class="mt-8 flex flex-col items-center gap-4">
            <a class="flex items-center gap-2 text-[#4c9a59] dark:text-primary text-sm font-semibold hover:underline group" href="javascript:void(0)" routerLink="/login">
                <span class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform">arrow_back</span> Back to Login
            </a>
        </div>
    </div>
</div>
