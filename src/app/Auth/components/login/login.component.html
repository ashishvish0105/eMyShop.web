<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden">
    <!-- Navigation Bar -->
    <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-[#e7f3e9] dark:border-[#1a3b1f] px-10 py-3 bg-white dark:bg-[#102213]">
        <div class="flex items-center gap-4 text-[#0d1b10] dark:text-[#f8fcf9]">
            <div class="size-6 text-primary">
                <svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z" fill="currentColor"></path>
</svg>
            </div>
            <h2 class="text-[#0d1b10] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">FoodieExpress</h2>
        </div>
        <div class="flex items-center gap-9">
            <a class="text-[#0d1b10] dark:text-[#f8fcf9] text-sm font-medium leading-normal hover:text-primary transition-colors" href="#">Home</a>
            <a class="text-[#0d1b10] dark:text-[#f8fcf9] text-sm font-medium leading-normal hover:text-primary transition-colors" href="#">Menu</a>
            <a class="text-[#0d1b10] dark:text-[#f8fcf9] text-sm font-medium leading-normal hover:text-primary transition-colors" href="#">Offers</a>
            <button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-[#0d1b10] text-sm font-bold leading-normal tracking-[0.015em] hover:brightness-110">
                    Sign Up
                </button>
        </div>
    </header>
    <!-- Main Content Area -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="layout-content-container flex flex-col w-full max-w-[480px] bg-white dark:bg-[#152a19] p-8 rounded-xl shadow-sm border border-[#e7f3e9] dark:border-[#1a3b1f]">
            <!-- Headline & Body Text -->
            <div class="mb-8">
                <h1 class="text-[#0d1b10] dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center pb-2">Welcome Back!</h1>
                <p class="text-[#4c9a59] dark:text-[#a1c9a8] text-base font-normal leading-normal text-center">Please enter your details to start ordering.</p>
            </div>
            <!-- Login Form -->
            <form class="flex flex-col gap-5">
                <!-- Username/Email Field -->
                <div class="flex flex-col gap-2">
                    <p class="text-[#0d1b10] dark:text-white text-base font-medium leading-normal">Email or Username</p>
                    <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d1b10] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-[#cfe7d3] dark:border-[#1a3b1f] bg-[#f8fcf9] dark:bg-[#102213] h-14 placeholder:text-[#4c9a59]/60 p-[15px] text-base font-normal"
                        placeholder="Enter your email or username" type="text" />
                </div>
                <!-- Password Field -->
                <div class="flex flex-col gap-2">
                    <p class="text-[#0d1b10] dark:text-white text-base font-medium leading-normal">Password</p>
                    <div class="flex w-full flex-1 items-stretch rounded-lg">
                        <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d1b10] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-[#cfe7d3] dark:border-[#1a3b1f] bg-[#f8fcf9] dark:bg-[#102213] h-14 placeholder:text-[#4c9a59]/60 p-[15px] rounded-r-none border-r-0 text-base font-normal"
                            placeholder="Enter your password" type="password" />
                        <div class="text-[#4c9a59] flex border border-[#cfe7d3] dark:border-[#1a3b1f] bg-[#f8fcf9] dark:bg-[#102213] items-center justify-center pr-[15px] rounded-r-lg border-l-0 cursor-pointer">
                            <span class="material-symbols-outlined" style="font-size: 24px;">visibility</span>
                        </div>
                    </div>
                </div>
                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between py-2">
                    <label class="flex items-center gap-2 cursor-pointer group">
<input class="h-5 w-5 rounded border-[#cfe7d3] dark:border-[#1a3b1f] text-primary focus:ring-primary bg-[#f8fcf9] dark:bg-[#102213]" type="checkbox"/>
<span class="text-[#0d1b10] dark:text-white text-sm font-medium">Remember me</span>
</label>
                    <a class="text-primary text-sm font-bold hover:underline" href="#">Forgot password?</a>
                </div>
                <!-- Sign In Button -->
                <button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-5 bg-primary text-[#0d1b10] text-base font-bold leading-normal tracking-[0.015em] hover:brightness-110 shadow-lg shadow-primary/20 transition-all"
                    type="submit">
<span class="truncate">Sign In</span>
</button>
            </form>
            <!-- Footer Link -->
            <div class="mt-8 text-center">
                <p class="text-[#4c9a59] dark:text-[#a1c9a8] text-sm">
                    New to FoodieExpress?
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Create an account</a>
                </p>
            </div>
        </div>
    </main>
    <!-- Optional Decorative Background Elements -->
    <div class="fixed top-0 right-0 -z-10 opacity-10 dark:opacity-5 pointer-events-none">
        <div class="w-[500px] h-[500px] bg-primary rounded-full blur-[100px] -mr-64 -mt-64"></div>
    </div>
    <div class="fixed bottom-0 left-0 -z-10 opacity-10 dark:opacity-5 pointer-events-none">
        <div class="w-[400px] h-[400px] bg-primary rounded-full blur-[100px] -ml-48 -mb-48"></div>
    </div>
</div>
